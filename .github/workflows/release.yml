name: Release

# A tag v<version> builds Nazzil for every platform and publishes a GitHub release with
# the files. The tag must name the version in flutter/pubspec.yaml, and the release notes
# are flutter/packaging/notes/<version>.md.
# Each run pushes its outcome and the end of each job's log to the ci-report branch, so a
# run can be read with git alone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

defaults:
  run:
    working-directory: flutter

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key, when the repository holds one
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=nazzil\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/key.properties
          else
            echo "No signing key among the repository secrets: the APK is signed with this machine's debug key."
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name the APK
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk "build/dist/Nazzil-$version-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: flutter/build/dist/*
          if-no-files-found: error

  apple:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Mac app and disk image
        run: |
          flutter build macos --release
          bash packaging/macos/dmg.sh
      - name: iPhone app, unsigned, for sideloading
        run: |
          flutter build ios --config-only --release --no-codesign
          xcodebuild -quiet \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/sideload-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
          bash tool/pack_ipa.sh
          version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          cp build/ios/sideload/Nazzil.ipa "build/dist/Nazzil-$version-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-apple
          path: flutter/build/dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc.FullName "/DAppVersion=$version" packaging\windows\nazzil.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: flutter/build/dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Linux build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libjson-glib-dev \
            libmp3lame0 libogg0 libopencore-amrnb0 libopus0 libshine3 libsoxr0 libspeex1 \
            libtwolame0 libvo-amrwbenc0 libvorbis0a libvorbisenc2 dpkg-dev file desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - run: bash packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: flutter/build/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, apple, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: flutter/build/dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not name version $version from pubspec.yaml" >&2
            exit 1
          fi
          ls -l build/dist
          notes="packaging/notes/$version.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Nazzil $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" build/dist/* --title "Nazzil $version" --notes-file "$notes" --verify-tag
          fi

  report:
    if: always()
    needs: [android, apple, windows, linux, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Push the outcome and the logs to the ci-report branch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          sleep 15
          mkdir report && cd report
          git init -q -b ci-report
          echo "$NEEDS" > needs.json
          printf 'ref %s\ncommit %s\nrun %s/%s/actions/runs/%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > run.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
            --jq '.jobs[] | select(.name != "report") | "\(.id) \(.conclusion // .status) \(.name)"' > jobs.txt || true
          while read -r id conclusion name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > full.txt 2>&1 || true
            lines=60
            [ "$conclusion" = success ] || lines=500
            tail -n "$lines" full.txt > "log-$name.txt"
          done < jobs.txt
          rm -f full.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json name,url,assets \
            --jq '{name, url, assets: [.assets[] | {name, size}]}' > release.json 2>&1 || true
          git add -A
          git -c user.name="Nazzil CI" -c user.email="ci@nazzil.invalid" commit -qm "Run $GITHUB_RUN_ID for $GITHUB_REF_NAME"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/ci-report
