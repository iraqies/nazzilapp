name: nazzil
description: Save videos, photos and audio from YouTube, TikTok, Instagram, Facebook, Reddit, X and Pinterest to your gallery.
publish_to: "none"
version: 2.4.0+27

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  gal: ^2.3.2
  http: ^1.5.0
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^11.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  video_player: ^2.10.0
  youtube_explode_dart: ^3.1.0
  ffmpeg_kit_flutter_new_audio: ^2.5.8
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_cache_manager: ^3.4.1
  file: ^7.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces Text
      fonts:
        - asset: assets/fonts/Fraunces-Text-Regular.ttf
        - asset: assets/fonts/Fraunces-Text-SemiBold.ttf
          weight: 600
    - family: Fraunces Display
      fonts:
        - asset: assets/fonts/Fraunces-Display-SemiBold.ttf
          weight: 600
    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
