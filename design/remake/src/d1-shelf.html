<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Nazzil remake, direction 1: Shelf</title>
<!--icons:rounded-->
<link rel="stylesheet" href="../src/fonts.css">
<link rel="stylesheet" href="../src/board.css">
<style>
  body { font-family: 'Fustat', sans-serif; }
  .bhead h1 { font-weight: 800; letter-spacing: -0.01em; }
  .bhead .num { font-weight: 800; }

  /* Shelf: paper, ink and one line that the covers stand on. */
  .s {
    --page: #F3F0E8; --sheet: #FFFFFF; --ink: #17150F; --muted: #6B665C; --line: #D8D2C4;
    --edge: #8E887B; --accent: #12B886; --on-accent: #0B0B0C; --accent-text: #0B6E4F; --scrim: rgba(23, 21, 15, .5);
    background: var(--page); color: var(--ink); font-family: 'Fustat', sans-serif; font-size: 15px; line-height: 1.35;
  }
  .s.dark {
    --page: #131210; --sheet: #1E1C18; --ink: #F2EEE6; --muted: #A49E92; --line: #34312A;
    --edge: #7A7468; --accent-text: #3DD6A5; --scrim: rgba(0, 0, 0, .62);
  }
  .s .top { display: flex; align-items: center; justify-content: space-between; padding: 44px 8px 0 20px; height: 100px; }
  .s[dir=rtl] .top { padding: 44px 20px 0 8px; }
  .s .brand { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
  .s .status { font-size: 13px; font-weight: 600; color: var(--accent-text); margin-top: 1px; }
  .s .iconbtn { width: 48px; height: 48px; display: grid; place-items: center; font-size: 24px; color: var(--ink); }

  .s .filters { display: flex; align-items: center; gap: 20px; height: 48px; padding: 0 20px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .s .filters span { height: 48px; display: flex; align-items: center; }
  .s .filters .on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink); }
  .s .filters .apps { margin-inline-start: auto; gap: 2px; color: var(--ink); font-weight: 600; }
  .s .filters .apps .i { font-size: 20px; }

  .s .day { padding: 14px 20px 0; }
  .s .day + .day { padding-top: 22px; }
  .s .day header { display: flex; align-items: baseline; justify-content: space-between; height: 30px; }
  .s .day h2 { font-size: 15px; font-weight: 700; }
  .s .day header span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .s .covers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: end; height: 165px; padding: 0 2px; }
  .s .cv { border-radius: 6px 6px 0 0; overflow: hidden; background: var(--line); }
  .s .cv img { width: 100%; height: 100%; object-fit: cover; }
  .s .cv.tall { aspect-ratio: 2 / 3; }
  .s .cv.photo { aspect-ratio: 4 / 5; }
  .s .cv.sq { aspect-ratio: 1; }
  .s .cv.wide { aspect-ratio: 3 / 2; }
  .s .cv.busy img { opacity: .34; }
  .s .cv img.cat { object-position: 80% 60%; }
  .s[dir=rtl] .titles b { text-align: right; }
  /* The shelf line. Under a download it doubles as that item's progress bar. */
  .s .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 2px; height: 2px; background: var(--ink); position: relative; }
  .s .shelf i { display: block; height: 4px; margin-top: -1px; }
  .s .shelf i.run { background: linear-gradient(to right, var(--accent) 62%, var(--page) 62%); outline: 1px solid var(--ink); }
  .s[dir=rtl] .shelf i.run { background: linear-gradient(to left, var(--accent) 62%, var(--page) 62%); }
  .s .shelf i.wait { background: var(--page); outline: 1px solid var(--ink); }
  .s .titles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 8px 2px 0; }
  .s .titles b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; line-height: 1.25; font-weight: 600; text-align: start; unicode-bidi: plaintext; }
  .s .titles small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .s .titles small.live { color: var(--accent-text); font-weight: 600; }

  .s .dock { position: absolute; inset: auto 0 0 0; height: 106px; background: var(--page); border-top: 1px solid var(--line); padding: 12px 12px 0; }
  .s .linkbar { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 8px 0 16px; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 16px; }
  .s[dir=rtl] .linkbar { padding: 0 16px 0 8px; }
  .s .linkbar .ph { flex: 1; font-size: 16px; color: var(--muted); }
  .s .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; }
  .s .btn .i { font-size: 20px; }

  .s .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .s .sheet { position: absolute; inset: auto 0 0 0; background: var(--sheet); border-radius: 20px 20px 0 0; padding: 10px 20px 26px; }
  .s .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
  .s .found { display: flex; gap: 16px; align-items: flex-end; }
  .s .found .cv { width: 118px; border-radius: 8px; }
  .s .found .meta { font-size: 13px; color: var(--muted); }
  .s .found h3 { font-size: 23px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; margin-top: 4px; }
  .s .found p { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .s .choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
  .s .choice span { height: 48px; display: flex; align-items: center; justify-content: center; gap: 7px; border: 1.5px solid var(--edge); border-radius: 10px; font-size: 15px; font-weight: 600; }
  .s .choice span .i { font-size: 20px; }
  .s .choice .on { background: var(--ink); border-color: var(--ink); color: var(--page); }
  .s .sheet .btn { width: 100%; height: 56px; border-radius: 12px; font-size: 17px; margin-top: 12px; }
  .s .sheet .quiet { display: flex; align-items: center; justify-content: center; height: 48px; margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--ink); }
</style>
