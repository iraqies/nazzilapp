<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Nazzil remake: four directions</title>
<link rel="stylesheet" href="../src/fonts.css">
<link rel="stylesheet" href="../src/board.css">
<style>
{{styles}}
  body { font-family: 'Readex Pro', sans-serif; }
  .bhead h1 { font-weight: 700; font-size: 50px; }
  .tall .bhead h1 { font-size: 44px; }
  .ov figcaption b { display: block; font-size: 30px; line-height: 1.1; margin-bottom: 6px; }
  .ov .n1 b { font-family: 'Fustat'; font-weight: 800; }
  .ov .n2 b { font-family: 'Lalezar'; font-weight: 400; font-size: 34px; }
  .ov .n3 b { font-family: 'Archivo'; font-weight: 800; font-stretch: 75%; font-size: 34px; }
  .ov .n4 b { font-family: 'Handjet'; font-weight: 800; font-size: 44px; line-height: .75; }
</style>

<header class="bhead">
  <div>
    <h1>Nazzil remake: four directions</h1>
    <p>The same Home screen, drawn four ways. Each direction has a board of its own with more screens.</p>
  </div>
  <div class="note">Mockups with sample posts. <br>The five colours stay in all four.</div>
</header>

<main class="phones ov">
  <figure class="n1">
    {{phone:d1-shelf:1}}
    <figcaption><b>1 Shelf</b>The calm one: your library is the home screen.</figcaption>
  </figure>
  <figure class="n2">
    {{phone:d2-billboard:1}}
    <figcaption><b>2 Billboard</b>The loud one: one flat colour and giant type.</figcaption>
  </figure>
  <figure class="n3">
    {{phone:d3-cinema:1}}
    <figcaption><b>3 Cinema</b>The dark one: the pictures get the whole screen.</figcaption>
  </figure>
  <figure class="n4">
    {{phone:d4-pocket:1}}
    <figcaption><b>4 Pocket</b>The playful one: a display on top, chunky keys below.</figcaption>
  </figure>
</main>
</html>
